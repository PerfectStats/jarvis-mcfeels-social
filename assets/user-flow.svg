<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-label="Owner workflow · approval precedes delivery"><rect width="1200" height="740" fill="#f7faf8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386750"/></marker></defs><text x="40" y="47" font-family="sans-serif" font-size="28" font-weight="bold" fill="#132e21">Owner workflow · approval precedes delivery</text><path d="M310,225 L310,265" stroke="#386750" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M310,405 L310,445" stroke="#386750" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M570,515 L615,515" stroke="#386750" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M615,515 L615,155" stroke="#386750" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M615,155 L665,155" stroke="#386750" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M910,225 L910,265" stroke="#386750" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M910,405 L910,445" stroke="#386750" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="50" y="85" width="520" height="140" rx="9" fill="#eaf4ee" stroke="#76a98b"/><text x="68" y="116" font-family="sans-serif" font-size="21" font-weight="bold" fill="#183727">1 · Connect and confirm MCFeels</text><text x="68" y="146" font-family="sans-serif" font-size="18" fill="#263e30">Owner completes Google consent privately.</text><text x="68" y="172" font-family="sans-serif" font-size="18" fill="#263e30">Channel ID/name must match and be confirmed.</text><text x="68" y="198" font-family="sans-serif" font-size="18" fill="#263e30">Recorded refresh test: passed.</text><rect x="50" y="265" width="520" height="140" rx="9" fill="#eaf4ee" stroke="#76a98b"/><text x="68" y="296" font-family="sans-serif" font-size="21" font-weight="bold" fill="#183727">2 · Review the long-form master</text><text x="68" y="326" font-family="sans-serif" font-size="18" fill="#263e30">Preview, packaging and findings visible.</text><text x="68" y="352" font-family="sans-serif" font-size="18" fill="#263e30">Approve / request changes / reject.</text><text x="68" y="378" font-family="sans-serif" font-size="18" fill="#263e30">Approval establishes bounded derivative authority.</text><rect x="50" y="445" width="520" height="140" rx="9" fill="#eaf4ee" stroke="#76a98b"/><text x="68" y="476" font-family="sans-serif" font-size="21" font-weight="bold" fill="#183727">3 · Create and validate a derivative</text><text x="68" y="506" font-family="sans-serif" font-size="18" fill="#263e30">Use approved style and source lineage.</text><text x="68" y="532" font-family="sans-serif" font-size="18" fill="#263e30">Supervisor PASS required for each derivative.</text><text x="68" y="558" font-family="sans-serif" font-size="18" fill="#263e30">Failures and uncertain findings return to owner.</text><rect x="665" y="85" width="485" height="140" rx="9" fill="#eaf4ee" stroke="#76a98b"/><text x="683" y="116" font-family="sans-serif" font-size="21" font-weight="bold" fill="#183727">4 · Upload once PRIVATE</text><text x="683" y="146" font-family="sans-serif" font-size="18" fill="#263e30">Separate authorized private test completed.</text><text x="683" y="172" font-family="sans-serif" font-size="18" fill="#263e30">Record ID and checksum; verify processing.</text><text x="683" y="198" font-family="sans-serif" font-size="18" fill="#263e30">Duplicate replay did not create another upload.</text><rect x="665" y="265" width="485" height="140" rx="9" fill="#fff5de" stroke="#ad8130"/><text x="683" y="296" font-family="sans-serif" font-size="21" font-weight="bold" fill="#183727">5 · Propose a future release</text><text x="683" y="326" font-family="sans-serif" font-size="18" fill="#263e30">Local calendar is not an external schedule.</text><text x="683" y="352" font-family="sans-serif" font-size="18" fill="#263e30">Update-capable scope + eligibility required.</text><text x="683" y="378" font-family="sans-serif" font-size="18" fill="#263e30">Remote schedule/reschedule/cancel: mock-tested.</text><rect x="665" y="445" width="485" height="140" rx="9" fill="#fff5de" stroke="#ad8130"/><text x="683" y="476" font-family="sans-serif" font-size="21" font-weight="bold" fill="#183727">6 · Future controlled execution</text><text x="683" y="506" font-family="sans-serif" font-size="18" fill="#263e30">Use the same video ID, not another upload.</text><text x="683" y="532" font-family="sans-serif" font-size="18" fill="#263e30">Revalidate → conditional update → read-back.</text><text x="683" y="558" font-family="sans-serif" font-size="18" fill="#263e30">UNCERTAIN stops progress; publishing still OFF.</text><text x="50" y="655" font-family="sans-serif" font-size="18" fill="#495b50">Owner authority is required throughout. Local dry-run approval cannot silently become live authority.</text><text x="50" y="695" font-family="sans-serif" font-size="18" fill="#495b50">The private test was separately authorized; no live public schedule was created.</text></svg>