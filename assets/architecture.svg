height="150" rx="9" fill="#eaf4ee" stroke="#76a98b"/><text x="483" y="266" font-family="sans-serif" font-size="21" font-weight="bold" fill="#183727">Private application backend</text><text x="483" y="296" font-family="sans-serif" font-size="18" fill="#263e30">OAuth / secure token storage</text><text x="483" y="322" font-family="sans-serif" font-size="18" fill="#263e30">Approval and Supervisor checks</text><text x="483" y="348" font-family="sans-serif" font-size="18" fill="#263e30">Source hashes + delivery receipts</text><rect x="875" y="235" width="285" height="150" rx="9" fill="#eaf4ee" stroke="#76a98b"/><text x="893" y="266" font-family="sans-serif" font-size="21" font-weight="bold" fill="#183727">Google / YouTube</text><text x="893" y="296" font-family="sans-serif" font-size="18" fill="#263e30">Owner OAuth consent</text><text x="893" y="322" font-family="sans-serif" font-size="18" fill="#263e30">Channel verification</text><text x="893" y="348" font-family="sans-serif" font-size="18" fill="#263e30">One private upload verified</text><rect x="40" y="485" width="330" height="170" rx="9" fill="#eaf4ee" stroke="#76a98b"/><text x="58" y="516" font-family="sans-serif" font-size="21" font-weight="bold" fill="#183727">Local content workflow</text><text x="58" y="546" font-family="sans-serif" font-size="18" fill="#263e30">Master → short derivative</text><text x="58" y="572" font-family="sans-serif" font-size="18" fill="#263e30">Render + technical/creative QA</text><text x="58" y="598" font-family="sans-serif" font-size="18" fill="#263e30">Local calendar is a proposal</text><text x="58" y="624" font-family="sans-serif" font-size="18" fill="#263e30">No public SaaS access</text><rect x="465" y="485" width="330" height="170" rx="9" fill="#fff5de" stroke="#ad8130"/><text x="483" y="516" font-family="sans-serif" font-size="21" font-weight="bold" fill="#183727">Existing-video update executor</text><text x="483" y="546" font-family="sans-serif" font-size="18" fill="#263e30">Schedule / reschedule / cancel</text><text x="483" y="572" font-family="sans-serif" font-size="18" fill="#263e30">ETag + read-back reconciliation</text><text x="483" y="598" font-family="sans-serif" font-size="18" fill="#263e30">MOCK TESTS ONLY</text><text x="483" y="624" font-family="sans-serif" font-size="18" fill="#263e30">No live execution enabled</text><rect x="875" y="485" width="285" height="170" rx="9" fill="#fff5de" stroke="#ad8130"/><text x="893" y="516" font-family="sans-serif" font-size="21" font-weight="bold" fill="#183727">Public-release gate</text><text x="893" y="546" font-family="sans-serif" font-size="18" fill="#263e30">Audit eligibility unresolved</text><text x="893" y="572" font-family="sans-serif" font-size="18" fill="#263e30">Future scope consent pending</text><text x="893" y="598" font-family="sans-serif" font-size="18" fill="#263e30">Live authority still required</text><text x="893" y="624" font-family="sans-serif" font-size="18" fill="#263e30">PUBLIC PUBLISHING OFF</text><text x="40" y="716" font-family="sans-serif" font-size="18" fill="#495b50">The review website is documentation only. It does not expose or proxy the private application.</text></svg>